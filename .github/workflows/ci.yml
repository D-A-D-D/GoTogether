name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Pinned, not `ubuntu-latest`: GitHub began moving that label to Ubuntu 26
    # on 2026-10-19, and an unattended image change shouldn't be able to turn
    # CI red on an unrelated push. Bump deliberately.
    runs-on: ubuntu-24.04
    env:
      # Dummy values so the API can boot in CI without real secrets.
      # /health and the unit suite don't touch a real database or issue
      # real tokens — see docs/ROADMAP.md for wiring up a Postgres service
      # container once tests actually need one.
      DATABASE_URL: "postgresql://gotogether:gotogether@localhost:5432/gotogether?schema=public"
      JWT_ACCESS_SECRET: "ci-only-access-secret"
      JWT_REFRESH_SECRET: "ci-only-refresh-secret"
      # NotificationsService.onModuleInit() calls webpush.setVapidDetails()
      # at boot, which validates key format — so these need to be a real,
      # well-formed VAPID pair (CI-only, unrelated to the dev .env's pair;
      # nothing ever actually sends a push in CI).
      VAPID_SUBJECT: "mailto:ci@example.com"
      VAPID_PUBLIC_KEY: "BAfybIdajMt-ce29lEo8ituEVH1cVNzthSOr_z_rnW87gO-RlmnCnf_mH-lmXQIYzfTZf9O8D6dXUyyX3ImoI3k"
      VAPID_PRIVATE_KEY: "IPtOAOrVEd18ttCqzLkEim03hS9GhBi6_-L-kDf7zTQ"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Criticals must never ship (one in proxy-addr, which decides a client's IP,
      # would have undermined the rate limiting). The remaining highs are known and
      # not reachable - an unused upload path, and the Prisma CLI's config loader
      # (docs/IDEAS.md) - so the bar is critical, not high.
      - name: Audit — production dependencies (no criticals)
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit test — api
        run: npm run test:api

      - name: Unit test — web (service worker)
        run: npm run test:web

      - name: E2E test — api
        run: npm run test:e2e
        working-directory: apps/api
