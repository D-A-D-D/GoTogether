name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Pinned, not `ubuntu-latest`: GitHub began moving that label to Ubuntu 26
    # on 2026-10-19, and an unattended image change shouldn't be able to turn
    # CI red on an unrelated push. Bump deliberately.
    runs-on: ubuntu-24.04
    env:
      # Dummy values so the API can boot in CI without real secrets.
      # /health and the unit suite don't touch a real database or issue
      # real tokens — see docs/ROADMAP.md for wiring up a Postgres service
      # container once tests actually need one.
      DATABASE_URL: "postgresql://gotogether:gotogether@localhost:5432/gotogether?schema=public"
      JWT_ACCESS_SECRET: "ci-only-access-secret"
      JWT_REFRESH_SECRET: "ci-only-refresh-secret"
      # NotificationsService.onModuleInit() calls webpush.setVapidDetails()
      # at boot, which validates key format — so these need to be a real,
      # well-formed VAPID pair (CI-only, unrelated to the dev .env's pair;
      # nothing ever actually sends a push in CI).
      VAPID_SUBJECT: "mailto:ci@example.com"
      VAPID_PUBLIC_KEY: "BAfybIdajMt-ce29lEo8ituEVH1cVNzthSOr_z_rnW87gO-RlmnCnf_mH-lmXQIYzfTZf9O8D6dXUyyX3ImoI3k"
      VAPID_PRIVATE_KEY: "IPtOAOrVEd18ttCqzLkEim03hS9GhBi6_-L-kDf7zTQ"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Criticals must never ship (one in proxy-addr, which decides a client's IP,
      # would have undermined the rate limiting). The remaining highs are known and
      # not reachable - an unused upload path, and the Prisma CLI's config loader
      # (docs/IDEAS.md) - so the bar is critical, not high.
      - name: Audit — production dependencies (no criticals)
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit test — api
        run: npm run test:api

      - name: Unit test — web (service worker)
        run: npm run test:web

      - name: Unit test — deployment smoke checks
        run: npm run test:scripts

      - name: E2E test — api
        run: npm run test:e2e
        working-directory: apps/api

  # The API as a container: builds the image and runs it the way a host would,
  # against a real Postgres, so a broken Dockerfile (or a native-engine mismatch,
  # a missing migration, a root user) fails here and not on deploy day.
  container:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gotogether
          POSTGRES_PASSWORD: gotogether
          POSTGRES_DB: gotogether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gotogether"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t gotogether-api .

      - name: A production start with no configuration is refused
        run: |
          set +e
          output=$(docker run --rm gotogether-api 2>&1)
          code=$?
          echo "$output" | tail -12
          [ "$code" -ne 0 ] || { echo "expected a non-zero exit"; exit 1; }
          echo "$output" | grep -q "not safe to start" || { echo "expected the configuration error"; exit 1; }

      - name: Write a sound production environment
        # Throwaway values for this job only. The Resend key is not real: registering sends a
        # verification email in the background, which must fail quietly without failing sign-up.
        run: |
          secret() { openssl rand -base64 48 | tr '+/' '-_' | tr -d '=\n'; }
          {
            echo "DATABASE_URL=postgresql://gotogether:gotogether@localhost:5432/gotogether?schema=public"
            echo "DATABASE_URL_DIRECT=postgresql://gotogether:gotogether@localhost:5432/gotogether?schema=public"
            echo "JWT_ACCESS_SECRET=$(secret)"
            echo "JWT_REFRESH_SECRET=$(secret)"
            echo "WEB_ORIGIN=https://app.example.test"
            echo "TRUST_PROXY=1"
            echo "PORT=3001"
            echo "EMAIL_PROVIDER=resend"
            echo "RESEND_API_KEY=ci-not-a-real-key"
            echo "EMAIL_FROM=GoTogether <no-reply@example.test>"
            echo "VAPID_SUBJECT=mailto:ci@example.com"
            echo "VAPID_PUBLIC_KEY=BAfybIdajMt-ce29lEo8ituEVH1cVNzthSOr_z_rnW87gO-RlmnCnf_mH-lmXQIYzfTZf9O8D6dXUyyX3ImoI3k"
            echo "VAPID_PRIVATE_KEY=IPtOAOrVEd18ttCqzLkEim03hS9GhBi6_-L-kDf7zTQ"
          } > "$RUNNER_TEMP/api.env"

      - name: Apply the migrations from inside the image
        run: docker run --rm --network host --env-file "$RUNNER_TEMP/api.env" gotogether-api npx prisma migrate deploy

      - name: Start the API
        run: docker run -d --name api --network host --env-file "$RUNNER_TEMP/api.env" gotogether-api

      - name: Wait until it is ready (it can reach the database)
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/health/ready || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "never became ready (last status: $code)"
          exit 1

      - name: Smoke test (the same script used on a real deployment)
        run: |
          node scripts/smoke.mjs --api http://localhost:3001 --web-origin https://app.example.test             --write --email ci-smoke@example.com

      - name: The process does not run as root
        run: |
          uid=$(docker exec api id -u)
          echo "uid $uid"
          [ "$uid" != "0" ] || { echo "running as root"; exit 1; }

      - name: It shuts down gracefully when told to
        run: |
          docker stop -t 15 api
          code=$(docker inspect -f '{{.State.ExitCode}}' api)
          echo "exit code $code"
          # 137 means it ignored SIGTERM and was killed.
          [ "$code" != "137" ] || { echo "did not shut down within 15s"; exit 1; }

      - name: Container log (always)
        if: always()
        run: |
          docker logs api 2>&1 | tail -60 || true
          docker image ls gotogether-api
